
  <!DOCTYPE html>
  <html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <title>Busca</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>

    <!-- campo de busca -->
    <input type="text" id="busca" placeholder="Digite para filtrar...">

    <!-- lista de itens que serão filtrados -->
    <ul>
      <li class="item">Banana</li>
      <li class="item">Laranja</li>
      <li class="item">Maçã</li>
      <li class="item">Morango</li>
      <li class="item">Melancia</li>
    </ul>

    <script>
      // seu código:
      $('#busca').on('input', function() {
        var termo = $(this).val().toLowerCase();
        $('.item').each(function() {
          var texto = $(this).text().toLowerCase();
          $(this).toggle(texto.indexOf(termo) !== -1);
        });
      });
    </script>

  </body>
  </html>
