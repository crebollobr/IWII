<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Trabalho — Cadastro de Alunos e Notas</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 32px auto; color:#222; }
  h1 { font-size: 1.4rem; }
  label { display:block; margin:10px 0 2px; font-weight:600; }
  input, select { width:100%; padding:7px; box-sizing:border-box; }
  .barra { margin-top:14px; }
  .barra button { margin:4px 4px 0 0; padding:7px 10px; cursor:pointer; }
  .erro { border:2px solid #c0392b !important; }
  #aviso { display:none; margin:10px 0; padding:8px; border-radius:6px; background:#2ecc71; color:#fff; }
  .info { color:#666; font-size:.9rem; }
  table { width:100%; border-collapse:collapse; margin-top:10px; }
  th, td { border:1px solid #ddd; padding:6px; text-align:left; }
  td input { width:90px; }
  .hidden { display:none; }
</style>
</head>
<body>

<!-- ===================== TELA 1: ALUNO ===================== -->
<section id="tela-aluno">
  <h1>📋 Cadastro de Alunos</h1>
  <p class="info">Registro <b id="pos">0</b> de <b id="total">0</b> <span id="idAtual"></span></p>
  <p id="aviso"></p>

  <input type="hidden" id="id">

  <label for="nome">Nome</label>
  <input type="text" id="nome" autocomplete="off">

  <label for="curso">Curso</label>
  <select id="curso">
    <!-- ✏️ as opções saem do vetor `cursos` — você popula com jQuery -->
  </select>

  <div class="barra">
    <button type="button" id="anterior">⏮ Anterior</button>
    <button type="button" id="proximo">Próximo ⏭</button>
    <button type="button" id="novo">✚ Novo</button>
    <button type="button" id="salvar">💾 Salvar</button>
    <button type="button" id="excluir">🗑 Excluir</button>
    <button type="button" id="irNotas">📝 Notas</button>
  </div>
</section>

<!-- ===================== TELA 2: NOTAS ===================== -->
<section id="tela-notas" class="hidden">
  <h1>📝 Notas de <span id="notasAluno"></span></h1>
  <table>
    <thead><tr><th>Disciplina</th><th>Nota</th></tr></thead>
    <tbody id="tabelaNotas">
      <!-- ✏️ uma linha por nota do aluno — você gera com jQuery -->
    </tbody>
  </table>
  <div class="barra">
    <button type="button" id="salvarNotas">💾 Salvar</button>
    <button type="button" id="voltar">⬅ Voltar</button>
  </div>
</section>

<script>
  // ============================================================
  //  DADOS FORNECIDOS — não precisa alterar (mas pode estudar!)
  // ============================================================

  // Vetor de cursos válidos. O `cursoId` de cada aluno aponta para um destes.
  var cursos = [
    { id: 1, nome: 'Informática para Internet' },
    { id: 2, nome: 'Desenvolvimento de Sistemas' },
    { id: 3, nome: 'Redes de Computadores' }
  ];

  // Vetor de alunos. Cada aluno tem suas próprias notas (vetor interno).
  var alunos = [
    { id: 1, nome: 'Ana Souza',  cursoId: 1, notas: [
        { disciplina: 'Programação Web', nota: 8.0 },
        { disciplina: 'Banco de Dados',  nota: 7.5 },
        { disciplina: 'Redes',           nota: 9.0 } ] },
    { id: 2, nome: 'Bruno Lima', cursoId: 2, notas: [
        { disciplina: 'Programação Web', nota: 6.0 },
        { disciplina: 'Banco de Dados',  nota: 7.0 },
        { disciplina: 'Redes',           nota: 5.5 } ] },
    { id: 3, nome: 'Carla Dias', cursoId: 3, notas: [
        { disciplina: 'Programação Web', nota: 9.5 },
        { disciplina: 'Banco de Dados',  nota: 8.5 },
        { disciplina: 'Redes',           nota: 10.0 } ] }
  ];

  var pos = 0;          // posição (índice) do aluno atual no vetor `alunos`
  var proximoId = 4;    // próximo id a usar quando cadastrar um aluno novo

  // Aviso visual reaproveitável (já pronto — use à vontade)
  function aviso(msg) {
    $('#aviso').text(msg).stop(true, true).fadeIn();
    setTimeout(function () { $('#aviso').fadeOut(); }, 1800);
  }

  $(function () {
    // ============================================================
    //  ✏️ SEU CÓDIGO AQUI
    //  Roteiro sugerido (detalhes e dicas no enunciado trabalho.md):
    //   1. popular o <select id="curso"> a partir do vetor `cursos`
    //   2. mostrar(pos): preencher nome / curso / id do aluno da posição `pos`
    //   3. Anterior / Próximo: andar em `pos` sem estourar os limites
    //   4. Novo: limpar o formulário para cadastrar um aluno
    //   5. Salvar: criar (sem id) OU editar (com id) — curso é obrigatório
    //   6. Excluir: remover do vetor `alunos` (com confirm) e mostrar outro
    //   7. Notas: ir para a Tela 2 e listar as notas do aluno atual
    //   8. Salvar Notas: ler os inputs e gravar de volta em alunos[pos].notas
    // ============================================================

  });
</script>
</body>
</html>
